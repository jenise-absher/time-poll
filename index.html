<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Time</title>
  <style>
    :root {
      --primary: #0472AE;
      --text: #12242B;
      --text-light: #F7FAFA;
      --page: #FBFCFC;
      --card: #FFFFFF;
      --border: #E3E9E9;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--page);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: var(--text-light);
      padding: 16px;
    }
    h1 {
      margin: 0;
      font-family: Calibri, Carlito, Arial, sans-serif;
      font-size: 1.5rem;
    }
    main {
      max-width: 560px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Find a Time</h1>
  </header>
  <main>
    <div class="card">
      <p>Hello! This is the start of a little tool to help friends find a time to meet.</p>
      <p>Coming soon: create a poll, share a link, see when everyone is free.</p>
    </div>
  </main>
</body>
</html>
